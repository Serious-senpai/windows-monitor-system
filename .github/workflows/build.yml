name: Build

on: [ push, pull_request ]

env:
  WINDOWS_MONITOR_PASSWORD: password

permissions:
  contents: read

jobs:
  build:
    name: Test build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Setup workspace
        run: |
          scripts\setup.bat
          dir
          type .cargo\config.toml

      - name: Install Inno Setup
        shell: cmd
        run: |
          curl https://files.jrsoftware.org/is/6/innosetup-6.5.4.exe --output innosetup-6.5.4.exe
          innosetup-6.5.4.exe /verysilent /dir="%cd%\inno-setup"
          dir inno-setup

      - name: Build workspace
        env:
          OPENSSL_DIR: ${{ github.workspace }}\extern\OpenSSL\3.4.1
          OPENSSL_CONF: ${{ github.workspace }}\extern\OpenSSL\3.4.1\ssl\openssl.cnf
        run: cargo build --release --target ${{ matrix.target }} -v

      - name: Build agent installer
        shell: cmd
        env:
          TARGET_DIR: ${{ matrix.target }}\
        run: inno-setup\iscc.exe scripts\package.iss

      - name: Package executables
        shell: cmd
        run: |
          mkdir packages packages\cert packages\utility packages\wm-api-service packages\wm-client packages\wm-data-service
          xcopy cert packages\cert\

          copy target\${{ matrix.target }}\release\utility.exe packages\utility\

          copy target\${{ matrix.target }}\release\wm-api-service.exe packages\wm-api-service\
          copy target\release\api-service-config.yml packages\wm-api-service\

          copy target\${{ matrix.target }}\release\wm-client.exe packages\wm-client\
          copy target\release\client-config.yml packages\wm-client\

          copy target\${{ matrix.target }}\release\wm-data-service.exe packages\wm-data-service\
          copy target\release\data-service-config.yml packages\wm-data-service\

          copy target\windows-monitor-installer.exe packages\

          tree /f packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: packages

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build Docker images
        run: docker compose build

      - name: List Docker images
        run: docker image ls

      - name: Export Docker images
        run: |
          docker image save -o elasticsearch.tar windows-monitor-elasticsearch
          docker image save -o kibana.tar windows-monitor-kibana

      - name: Upload Docker images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            elasticsearch.tar
            kibana.tar
